name: Pipeline DevSecOps

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-e-testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest

  segredos-gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
      - name: Procurar segredos no historico
        run: ./gitleaks detect --source . --log-opts="HEAD" --redact -v --exit-code 2

  sast-semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - run: semgrep scan --config p/python --config .semgrep/regras.yml --error --metrics=off .

  sca-pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  publicar:
    needs: [build-e-testes, segredos-gitleaks, sast-semgrep, sca-pip-audit]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Security gate aprovado. Publicacao liberada."
